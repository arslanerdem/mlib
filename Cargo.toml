[package]
name = "mlib"
version = "0.0.1"
edition = "2021"
authors = ["Erdem Arslan"]
description = "Fast, readable machine learning for tabular data: tables, pipelines, random forests, gradient boosting."
license = "MIT"
repository = "https://github.com/arslanerdem/mlib"
readme = "README.md"
keywords = ["machine-learning", "random-forest", "gradient-boosting", "tabular", "pipeline"]
categories = ["science", "algorithms"]
# Design documents and the comparison study are not published yet.
exclude = ["mlib-docs/", "compare/", "CLAUDE.md", "examples/compare.rs"]

[dependencies]
# Pinned exactly: ndarray version skew across crates is a recurring source of errors.
ndarray = "=0.16.1"
rayon = "1.10"
csv = "1.3"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: a saved model must load with bit-identical numbers.
serde_json = { version = "1", features = ["float_roundtrip"] }
typetag = "0.2"

[profile.release]
codegen-units = 1
lto = "thin"
